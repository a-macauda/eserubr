<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">


    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <h1>Rubriaca</h1>
    </header>


    <section class="container-fluid my-5">
        <div class="grid text-center grid-cols-4">
            <article class="col-12 col-md-4">
                <button id="showButton" class="btn btn-primary">Mostra</button>
            </article>
            <article class="col-12 col-md-4">
                <button id="addButton" class="btn btn-primary">Aggiungi</button>
            </article>
            <article class="col-12 col-md-4">
                <button id="editButton" class="btn btn-primary">Modifica</button>
            </article>
            <article class="col-12 col-md-4">
                <button id="deleteButton" class="btn btn-primary">Elimina</button>
            </article>
        </div>
    </section>

    <section class="container-fluid my-5">
        <div class="row justify-content-center-text-center">
        <div class="mx-auto col-12 col-md-6 offset-md-3">
            <input type="text" id="nameInput" placeholder="Nome" >
        </div>
            <div class="mx-auto col-12 col-md-6 offset-md-3">
            <input type="number" id="numInput" placeholder="Numero" class="mt-5">
        </div>
        
      </section>
    
    <div class="container col-12 justify-content-center text-center my-5">
        

    </div>
        </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <script src="main.js"></script>
</body>
</html>
